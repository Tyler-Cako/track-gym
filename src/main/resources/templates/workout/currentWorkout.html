<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<form action="POST" th:object=${workout}>
    <h2 th:text="*{workoutName}">Workout Name</h2>
    <div th:each="exerciseCard : *{exerciseCards}">
        <h4 th:text="${exerciseCard.name}">Exercise Name</h4>
        <div th:each="splitCard : ${exerciseCard.splitCards}">
            <label th:for=${splitCard.id} th:text="|Set: ${splitCard.weight}x${splitCard.reps}|">Set: x</label>
            <input type="number" th:name="${splitCard.id}" />
        </div>
    </div>
</form>
</body>
</html>
